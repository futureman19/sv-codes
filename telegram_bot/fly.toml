# Dedicated @svcodesbot deployment; token exists only in Fly secrets.
app = "sv-code-decoder"
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  TELEGRAM_STATE_DB = "/data/offset.sqlite3"
  TELEGRAM_EXPECTED_USERNAME = "svcodesbot"

[processes]
  app = "python -B -m telegram_bot.bootstrap"

[[mounts]]
  source = "decoder_state"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
# No public HTTP service. Exactly ONE machine / poller. Bootstrap initializes
# mounted-volume ownership then drops to uid/gid10001 before polling.
