# EXAMPLE ONLY. Do not provision/deploy without approval and a dedicated token.
app = "sv-code-decoder"
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  TELEGRAM_STATE_DB = "/data/offset.sqlite3"

[processes]
  app = "python -B -m telegram_bot serve"

[[mounts]]
  source = "decoder_state"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
# No public HTTP service. Exactly ONE machine / poller. Mounted volume must
# be writable by uid 10001 (initialize ownership before running this image).
